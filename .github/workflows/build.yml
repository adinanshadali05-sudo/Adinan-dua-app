name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web files
        run: |
          mkdir -p www
          cp "$(ls *.html | head -n1)" www/index.html
          echo '{"name":"adinan-dua-app","version":"1.0.0","private":true}' > package.json
          echo '{"appId":"com.adinan.duaapp","appName":"Adinan Dua App","webDir":"www"}' > capacitor.config.json
      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications
      - name: Add Android and sync
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Adinan-Dua-App-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
